[project]
name = "dpec"
version = "0.1.0"
description = "Race pace forecasts with honest uncertainty, tyre and pit-stop decisions, a debrief and a graded AI race engineer, on public Formula 1 timing data (2022-2026)."
readme = "README.md"
authors = [
    { name = "Shavkatjon Yuldashev", email = "shavkatjon.yuldashev.0411@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=1.5.6",
    "fastapi>=0.162.0",
    "fastf1>=3.8.3",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "statsmodels>=0.15.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/shavkatjony/F1-pace-intelligence"
Demo = "https://f1-pace-intelligence.onrender.com"
Documentation = "https://github.com/shavkatjony/F1-pace-intelligence/blob/main/docs/methods.md"

[project.scripts]
dpec = "dpec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/dpec", "src/telemetry_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/telemetry_core"]  # any test can reuse the fake weekend in test_warehouse.py

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


